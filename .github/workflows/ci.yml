name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  # ─────────────────────────────────────────────
  # FRONTEND — Next.js lint, test, build
  # ─────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values — only needed so Next.js build doesn't error on missing env
          APP_JWT_SECRET: ci-dummy-jwt-secret-minimum-32-characters-long
          APP_REDIRECT_SIGNING_SECRET: ci-dummy-redirect-signing-secret-32chars
          APP_BACKEND_URL: http://localhost:8080
          APP_FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

  # ─────────────────────────────────────────────
  # GATEWAY — Spring Cloud Gateway build + test
  # ─────────────────────────────────────────────
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test gateway
        run: mvn -f gateway/pom.xml verify -B

  # ─────────────────────────────────────────────
  # BACKEND — Spring Boot build + test
  # Redis service container needed for rate limiting
  # H2 in-memory DB used for tests (no Postgres needed)
  # ─────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test backend
        run: mvn -f backend/pom.xml verify -B
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          APP_JWT_SECRET: ci-dummy-jwt-secret-minimum-32-characters-long
          APP_REDIRECT_SIGNING_SECRET: ci-dummy-redirect-signing-secret-32chars

  # ─────────────────────────────────────────────
  # DOCKER — Build & push images (main branch only)
  # ─────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, gateway]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image prefix
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER}/qr-manager" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-frontend:latest
            ${{ steps.meta.outputs.prefix }}-frontend:${{ steps.meta.outputs.sha_tag }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:latest
            ${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.sha_tag }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-gateway:latest
            ${{ steps.meta.outputs.prefix }}-gateway:${{ steps.meta.outputs.sha_tag }}

services:
  postgres:
    image: postgres:16-alpine
    container_name: seq-lams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seqlams}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres} -d ${POSTGRES_DB:-seqlams}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: seq-lams-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: seq-lams-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: seq-lams-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SPRING_DATA_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${GHCR_IMAGE_PREFIX}-backend:latest
    container_name: seq-lams-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_ACCESS_TOKEN_TTL_MINUTES: ${APP_JWT_ACCESS_TOKEN_TTL_MINUTES:-1440}
      APP_JWT_REFRESH_TOKEN_TTL_DAYS: ${APP_JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      APP_REDIRECT_SIGNING_SECRET: ${APP_REDIRECT_SIGNING_SECRET}
      APP_REQUIRE_SIGNED_REDIRECTS: ${APP_REQUIRE_SIGNED_REDIRECTS:-true}
      APP_MESSAGING_ENABLED: ${APP_MESSAGING_ENABLED:-true}
      APP_ANALYTICS_OLAP_ENABLED: ${APP_ANALYTICS_OLAP_ENABLED:-true}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS:-noreply@qrmanager.app}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seqlams}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_REDIS_TIMEOUT: ${SPRING_DATA_REDIS_TIMEOUT:-5s}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/default
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:8080:8080"

  gateway:
    image: ${GHCR_IMAGE_PREFIX}-gateway:latest
    container_name: seq-lams-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      GATEWAY_BACKEND_URL: http://backend:8080
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8081:8081"

  frontend:
    image: ${GHCR_IMAGE_PREFIX}-frontend:latest
    container_name: seq-lams-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_API_URL: http://gateway:8081
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: seq-lams-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.2
    container_name: seq-lams-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3001
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:

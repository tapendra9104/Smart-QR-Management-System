# Render Blueprint for Smart QR Management System
#
# This deploys the Spring Boot API and Spring Cloud Gateway from their Dockerfiles.
# The backend can use either:
#   DATABASE_URL=postgresql://user:password@host/db?sslmode=require
# or:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/db?sslmode=require
#   SPRING_DATASOURCE_USERNAME=user
#   SPRING_DATASOURCE_PASSWORD=password

services:
  - type: web
    name: qr-manager-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_REDIRECT_SIGNING_SECRET
        sync: false
      - key: APP_FRONTEND_URL
        value: https://smart-qr-management-system.vercel.app

      # Preferred for Neon/Render/Postgres provider connection strings.
      - key: DATABASE_URL
        sync: false

      # Optional explicit JDBC settings. Use these instead of DATABASE_URL only
      # if you want to split URL, username, and password in Render.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver

      # Keep the free Render deploy independent of Redis/RabbitMQ/ClickHouse.
      - key: SPRING_CACHE_TYPE
        value: simple
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "false"
      - key: APP_RATE_LIMIT_ENABLED
        value: "false"
      - key: APP_MESSAGING_ENABLED
        value: "false"
      - key: APP_ANALYTICS_OLAP_ENABLED
        value: "false"
      - key: APP_MAIL_ENABLED
        value: "false"

      - key: APP_JWT_ACCESS_TOKEN_TTL_MINUTES
        value: "1440"
      - key: APP_JWT_REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: APP_REQUIRE_SIGNED_REDIRECTS
        value: "true"
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m"

  - type: web
    name: qr-manager-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: GATEWAY_BACKEND_URL
        value: https://qr-manager-backend-dadr.onrender.com
      - key: APP_FRONTEND_URL
        value: https://smart-qr-management-system.vercel.app
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx192m"

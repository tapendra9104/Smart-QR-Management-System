apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - path: ingress-aws-patch.yaml

images:
  - name: seq-lams-backend
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/seq-lams-backend
    newTag: latest
  - name: seq-lams-gateway
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/seq-lams-gateway
    newTag: latest
  - name: seq-lams-frontend
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/seq-lams-frontend
    newTag: latest

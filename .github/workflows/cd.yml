name: cd

# ─────────────────────────────────────────────────────────────────────────────
# Continuous Deployment — runs AFTER ci.yml succeeds on main.
#
# HOW TO ACTIVATE:
#   1. Go to your repo → Settings → Secrets and variables → Actions
#   2. Add these repository secrets:
#        SSH_HOST   — IP address or hostname of your server
#        SSH_USER   — SSH username (e.g. ubuntu, deploy)
#        SSH_KEY    — Private key content (the full -----BEGIN ... KEY----- block)
#   3. Push to main — this workflow will SSH into your server and deploy.
#
# HOW IT WORKS:
#   • The ci.yml workflow builds and pushes Docker images to ghcr.io
#   • This workflow SSHs into your server and runs:
#       docker compose pull && docker compose up -d
#   • All images are pulled from ghcr.io (no build step on the server)
#
# PREREQUISITES ON THE SERVER:
#   • Docker + Docker Compose v2 installed
#   • docker-compose.yml present at ~/qr-manager/docker-compose.yml
#   • .env file at ~/qr-manager/.env with production secrets
#   • Server logged in to ghcr.io:
#       echo $CR_PAT | docker login ghcr.io -u USERNAME --password-stdin
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only run if CI succeeded AND we have the SSH secret configured
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/qr-manager

            # Pull latest images for all services from ghcr.io
            docker compose pull

            # Restart services with zero-downtime rolling update
            docker compose up -d --remove-orphans

            # Remove old dangling images to save disk space
            docker image prune -f

            echo "✅ Deployment complete — $(date)"

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Wait up to 60 seconds for the frontend to be healthy
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ Frontend is up"
                exit 0
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done
            echo "❌ Frontend did not become healthy in time"
            exit 1

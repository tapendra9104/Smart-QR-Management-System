spring:
  datasource:
    url: jdbc:h2:mem:seq-lams-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cache:
    type: simple
  mail:
    host: localhost
    port: 25
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  frontend-url: http://localhost:3000
  jwt:
    secret: Q2hhbmdlVGhpc0RldlNlY3JldEtleUZvclByb2R1Y3Rpb25Ub2tlblNpZ25pbmcxMjM0NTY=
    access-token-ttl-minutes: 1440
    refresh-token-ttl-days: 7
  redirect:
    signing-secret: dGVzdC1zaWduaW5nLXNlY3JldC1mb3ItY2ktdGVzdHMtb25seQ==
    require-signature: false
  rate-limit:
    enabled: false
  messaging:
    enabled: false
  analytics:
    olap-enabled: false
  mail:
    enabled: false

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

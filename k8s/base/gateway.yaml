apiVersion: v1
kind: Service
metadata:
  name: seq-lams-gateway
spec:
  selector:
    app: seq-lams-gateway
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq-lams-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seq-lams-gateway
  template:
    metadata:
      labels:
        app: seq-lams-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: gateway
          image: seq-lams-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: APP_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: seq-lams-config
                  key: APP_FRONTEND_URL
            - name: GATEWAY_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: seq-lams-config
                  key: GATEWAY_BACKEND_URL
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
